<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperTree · 批注式对话</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/annotate.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">P</div>
    <div>
      <div class="brand-name">PaperTree</div>
      <div class="brand-sub">批注式论文阅读</div>
    </div>
  </div>
  <button class="icon-btn sidebar-unfold" id="sidebarUnfold" title="展开侧边栏" hidden>▤</button>
  <div class="session">
    <span class="session-label">会话</span>
    <strong id="sessionTitle">加载中…</strong>
    <span class="paper-chip" id="paperChip">未设置论文</span>
    <span class="mode-badge" id="modeBadge">…</span>
  </div>
  <div class="top-actions">
    <button class="btn" id="toggleNotes" title="一键收起/显示本会话所有批注">收起批注</button>
    <button class="btn" id="graphBtn">结构图</button>
    <button class="btn" id="settingsBtn">设置</button>
    <div class="avatar">我</div>
  </div>
</header>

<div class="app-body">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div>
        <div class="sidebar-kicker">SESSION TREE</div>
        <div class="sidebar-title">提问结构 <span id="treeCount"></span></div>
      </div>
      <button class="icon-btn sidebar-fold" id="sidebarFold" title="收起侧边栏">▤</button>
    </div>
    <div class="tree" id="tree"></div>
    <div class="sidebar-foot">
      <button class="btn" id="graphBtn2">查看结构图</button>
      <button class="btn" id="settingsBtn2">设置</button>
    </div>
  </aside>

  <main class="chat-main" id="chatMain">
    <div class="thread-scroll" id="threadScroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="chat-composer" id="composer">
      <div class="quote-chip" id="quoteChip" hidden>
        <span class="quote-mark">“</span>
        <span id="quoteText"></span>
        <button id="clearQuote" title="清除引文">×</button>
      </div>
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="问一个新问题…（会新建一棵树；Enter 发送）"></textarea>
        <button class="send-btn" id="sendBtn" title="发送" disabled>↑</button>
      </div>
      <div class="composer-foot">
        <span class="hint">底部提问 = 新树根；选中回答里的句子 →「新建批注」</span>
        <span class="composer-right">
          <select id="askMode" class="mini-select" title="检索模式">
            <option value="academic">学术优先</option>
            <option value="web">网页优先</option>
          </select>
          <span class="hint" id="threadHint"></span>
        </span>
      </div>
    </div>

    <div class="note-backdrop" id="noteBackdrop" hidden></div>
    <div class="annotation-layer" id="annotationLayer" aria-hidden="true">
      <svg id="connectors"></svg>
      <div id="notes"></div>
      <svg id="connectorsTop"></svg>
    </div>
  </main>
</div>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="sourceDrawer" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <div class="drawer-kicker">来源详情</div>
      <h3 id="drawerTitle">—</h3>
    </div>
    <button class="icon-btn" id="closeDrawer" title="关闭">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal-backdrop graph-backdrop" id="graphModal" hidden>
  <div class="graph-modal">
    <div class="graph-head">
      <div>
        <div class="drawer-kicker">STRUCTURE</div>
        <h2>提问结构图</h2>
      </div>
      <div class="graph-actions">
        <button class="btn" id="graphFit">适应</button>
        <button class="icon-btn" id="graphClose" title="关闭">✕</button>
      </div>
    </div>
    <div class="graph-viewport" id="graphViewport">
      <div class="graph-canvas" id="graphCanvas">
        <svg id="graphEdges"></svg>
        <div id="graphNodes"></div>
      </div>
      <div class="graph-hint">拖拽平移 · 滚轮缩放 · 点击节点回到主对话</div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div>
        <div class="drawer-kicker">配置</div>
        <h2>论文与 API</h2>
      </div>
      <button class="icon-btn" id="closeSettings" title="关闭">✕</button>
    </div>
    <div class="modal-body">
      <div class="api-status" id="apiStatus"></div>
      <label class="field">
        <span>会话名称</span>
        <input id="sessionTitleInput" type="text" maxlength="120">
      </label>
      <label class="field">
        <span>论文标题</span>
        <input id="paperTitleInput" type="text" maxlength="240">
      </label>
      <label class="field">
        <span>论文原文 / 摘要 <em>（下一步接 PDF）</em></span>
        <textarea id="paperTextInput" rows="8"></textarea>
      </label>
      <label class="field">
        <span>默认检索模式</span>
        <select id="modeInput">
          <option value="academic">学术优先（推荐）</option>
          <option value="web">网页优先</option>
        </select>
      </label>
      <div class="field" id="desktopKeyField" hidden>
        <span>DeepSeek API Key <em>（加密保存在本机）</em></span>
        <input id="desktopKeyInput" type="password" autocomplete="off" placeholder="sk-...">
        <div class="modal-note">保存后会自动重启本地检索服务。Key 不会上传。</div>
        <div class="modal-actions" style="margin-top:2px">
          <button class="btn primary" id="saveDesktopKey">保存 Key</button>
          <button class="btn" id="clearDesktopKey">清除 Key</button>
          <button class="btn" id="openDataDir">打开数据目录</button>
        </div>
      </div>
      <div class="modal-note" id="keyHelp"></div>
      <div class="modal-actions">
        <button class="btn" id="demoBtn">载入示例树</button>
        <button class="btn danger" id="resetBtn">清空所有节点</button>
        <span class="spacer"></span>
        <button class="btn" id="cancelSettings">取消</button>
        <button class="btn primary" id="saveSettings">保存</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script type="module" src="/annotate.js"></script>
</body>
</html>
