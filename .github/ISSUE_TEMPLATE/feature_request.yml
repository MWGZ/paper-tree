name: Feature request
description: Suggest an improvement for paper reading or annotation
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the reading/annotation workflow, not just the UI control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the app do? Screenshots or sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: Annotation notes / connectors
        - label: Tree navigation / structure graph
        - label: DeepSeek research / citations
        - label: PDF / paper upload
        - label: Desktop packaging / installer
        - label: Documentation
