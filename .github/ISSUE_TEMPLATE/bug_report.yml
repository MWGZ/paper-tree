name: Bug report
description: Report a reproducible problem (please do not include API keys or private papers)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security issues, use the private reporting link in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release or commit you are running
      placeholder: "0.3.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you click/type, and in what order?
      placeholder: |
        1. Open a demo tree
        2. Select ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots or a short recording are welcome. Remove private paper text.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: Optional. Do not paste API keys or private paper content.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, private paper text, and personal data from this report.
          required: true
