name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Syntax and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORT: "4317"
      HOST: "127.0.0.1"
      DEMO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and metadata checks
        run: npm run check
      - name: Smoke test local server
        env:
          DATA_FILE: ${{ runner.temp }}/papertree-ci-db.json
        run: |
          set -euo pipefail
          node app/server.mjs > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:${PORT}/api/health" | grep -q '"ok":true'
          curl -fsS -X POST "http://127.0.0.1:${PORT}/api/demo" >/dev/null
          curl -fsS "http://127.0.0.1:${PORT}/" | grep -q 'PaperTree'
          curl -fsS "http://127.0.0.1:${PORT}/annotate.js" | grep -q 'renderNotes'
          echo "Smoke test passed."
